        /**
         * 날짜 문자열(YYYY-MM-DD)을 한국어 표기로 변환
         */
        function formatKoreanDate(dateStr) {
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const [year, month, day] = dateStr.split('-').map(Number);
            const dateObj = new Date(year, month - 1, day);
            const dayName = days[dateObj.getDay()];
            return `${year}년 ${month}월 ${day}일 (${dayName})`;
        }

        /**
         * 날짜 증감 계산 함수
         */
        function addDays(dateStr, daysToAdd) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const dateObj = new Date(year, month - 1, day);
            dateObj.setDate(dateObj.getDate() + daysToAdd);
            
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        /**
         * 오늘 날짜 문자열 반환 (YYYY-MM-DD)
         */
        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        /**
         * 두 날짜 간의 일수 차이 계산
         */
        function getDiffDays(baseDateStr, targetDateStr) {
            const [y1, m1, d1] = baseDateStr.split('-').map(Number);
            const [y2, m2, d2] = targetDateStr.split('-').map(Number);
            const t1 = new Date(y1, m1 - 1, d1).getTime();
            const t2 = new Date(y2, m2 - 1, d2).getTime();
            return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
        }

        /**
         * 향후 30일간의 급식 데이터 수집
         */
        async function refreshUpcomingMealsCache() {
            upcomingMealsCache = {};

            if (!state.selectedSchool) {
                const mealLabels = { breakfast: '조식', lunch: '중식', dinner: '석식' };
                Object.entries(SAMPLE_MEALS).forEach(([dateStr, dayData]) => {
                    const items = [];
                    Object.entries(dayData).forEach(([key, meal]) => {
                        if (meal && meal.menus) {
                            meal.menus.forEach(m => {
                                items.push({ mealType: mealLabels[key], menuName: m.name });
                            });
                        }
                    });
                    upcomingMealsCache[dateStr] = items;
                });
                favoriteScanStatus.textContent = "샘플 식단 탐색 완료 ✨";
                renderFavoriteMenus();
                return;
            }

            favoriteScanStatus.textContent = "식단 탐색 중...";
            const startStr = getTodayStr();
            const endStr = addDays(startStr, 30);
            const fromYmd = startStr.replace(/-/g, '');
            const toYmd = endStr.replace(/-/g, '');

            try {
                const keyParam = state.apiKey ? `&KEY=${encodeURIComponent(state.apiKey)}` : '';
                const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=200&ATPT_OFCDC_SC_CODE=${state.selectedSchool.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${state.selectedSchool.SD_SCHUL_CODE}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}${keyParam}`;
                
                const response = await fetch(url);
                const data = await response.json();
                const rows = data.mealServiceDietInfo?.[1]?.row || [];

                rows.forEach(row => {
                    const rawYmd = row.MLSV_YMD;
                    const dateStr = `${rawYmd.slice(0, 4)}-${rawYmd.slice(4, 6)}-${rawYmd.slice(6, 8)}`;
                    if (!upcomingMealsCache[dateStr]) upcomingMealsCache[dateStr] = [];

                    const mealType = row.MMEAL_SC_NM || '급식';
                    const rawDishes = row.DDISH_NM.split(/<br\s*\/?>/i);
                    rawDishes.forEach(dishStr => {
                        const cleanName = dishStr.replace(/\([0-9.\s]+\)/g, '').trim();
                        if (cleanName) {
                            upcomingMealsCache[dateStr].push({ mealType, menuName: cleanName });
                        }
                    });
                });

                favoriteScanStatus.textContent = "탐색 완료 ✨";
            } catch (err) {
                console.error(err);
                favoriteScanStatus.textContent = "탐색 실패";
            }

            renderFavoriteMenus();
        }

        /**
         * 나이스 API: 학교 검색
         */
        async function searchSchoolFromNeis(keyword) {
            schoolSearchResults.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">검색 중...</div>`;
            schoolSearchResults.classList.remove('hidden');

            try {
                const keyParam = state.apiKey ? `&KEY=${encodeURIComponent(state.apiKey)}` : '';
                const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=20&SCHUL_NM=${encodeURIComponent(keyword)}${keyParam}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.RESULT && data.RESULT.CODE !== 'INFO-000') {
                    schoolSearchResults.innerHTML = `<div class="p-3 text-center text-xs text-rose-400">검색 결과가 없어요!</div>`;
                    return;
                }

                const schools = data.schoolInfo?.[1]?.row || [];
                if (schools.length === 0) {
                    schoolSearchResults.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">일치하는 학교가 없어요.</div>`;
                    return;
                }

                schoolSearchResults.innerHTML = '';
                schools.forEach(school => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = "w-full text-left px-4 py-2.5 hover:bg-emerald-50/60 transition flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-xs";
                    item.innerHTML = `
                        <div>
                            <span class="font-semibold text-slate-800">${school.SCHUL_NM}</span>

        /**
         * 나이스 API: 급식 조회
         */
        async function fetchMealsFromNeis(school, dateStr) {
            const ymd = dateStr.replace(/-/g, '');
            const keyParam = state.apiKey ? `&KEY=${encodeURIComponent(state.apiKey)}` : '';
            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${school.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${school.SD_SCHUL_CODE}&MLSV_YMD=${ymd}${keyParam}`;

            const response = await fetch(url);
            const data = await response.json();

            if (data.RESULT && data.RESULT.CODE !== 'INFO-000') {
                return null;
            }

            const rows = data.mealServiceDietInfo?.[1]?.row || [];
            if (rows.length === 0) return null;

            const result = {};
            const codeMap = { '1': 'breakfast', '2': 'lunch', '3': 'dinner' };

            rows.forEach(row => {
                const mealKey = codeMap[row.MMEAL_SC_CODE];
                if (!mealKey) return;

                const rawDishes = row.DDISH_NM.split(/<br\s*\/?>/i);
                const menus = rawDishes
                    .map(dishStr => {
                        const trimmed = dishStr.trim();
                        if (!trimmed) return null;

                        const allergyMatch = trimmed.match(/\(([0-9.\s]+)\)/);
                        let allergies = [];
                        if (allergyMatch) {
                            allergies = allergyMatch[1]
                                .split('.')
                                .map(num => parseInt(num.trim(), 10))
                                .filter(num => !isNaN(num) && ALLERGY_MAP[num]);
                        }

                        const cleanName = trimmed.replace(/\([0-9.\s]+\)/g, '').trim();
                        return { name: cleanName, allergies };
                    })
                    .filter(Boolean);

                result[mealKey] = {
                    calories: row.CAL_INFO || '정보 없음',
                    menus
                };
            });

            return result;
        }

        /**
         * 날짜별 급식 불러오기
         */
        async function loadMeals(dateStr) {
            state.currentDate = dateStr;
            datePicker.value = dateStr;
            displayDateText.textContent = formatKoreanDate(dateStr);

            updateQuickChips(dateStr);

            mealContainer.innerHTML = `
                <div class="col-span-1 md:col-span-3 insta-glass rounded-3xl p-10 text-center text-slate-400 text-xs">
                    <p>식단을 불러오는 중이에요... ☁️</p>
                </div>
            `;

            if (state.selectedSchool) {
                try {
                    const neisMealData = await fetchMealsFromNeis(state.selectedSchool, dateStr);
                    renderMealCards(neisMealData, true);
                } catch (err) {
                    console.error(err);
                    showMessage("데이터를 불러오지 못했어요.", true);
                    renderMealCards(null, true);
                }
            } else {
                const sampleData = SAMPLE_MEALS[dateStr] || null;
                renderMealCards(sampleData, false);
            }
        }

        /**
         * 주간 빠른 선택 칩 업데이트
         */
        function updateQuickChips(baseDateStr) {
            quickDateChips.innerHTML = '';
            const [year, month, day] = baseDateStr.split('-').map(Number);
            const currentObj = new Date(year, month - 1, day);
            
            const dayOfWeek = currentObj.getDay();
            const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            
            const mondayObj = new Date(currentObj);
            mondayObj.setDate(currentObj.getDate() + diffToMonday);

            const shortDays = ['월', '화', '수', '목', '금'];

            for (let i = 0; i < 5; i++) {
                const targetObj = new Date(mondayObj);
                targetObj.setDate(mondayObj.getDate() + i);
                
                const y = targetObj.getFullYear();
                const m = String(targetObj.getMonth() + 1).padStart(2, '0');
                const d = String(targetObj.getDate()).padStart(2, '0');
                const dateStr = `${y}-${m}-${d}`;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = `${Number(m)}/${Number(d)} (${shortDays[i]})`;
                
                if (dateStr === baseDateStr) {
                    btn.className = "px-3 py-1.5 rounded-xl font-medium text-xs bg-slate-800 text-white shadow-2xs transition cursor-pointer";
                } else {
                    btn.className = "px-3 py-1.5 rounded-xl text-xs bg-white/60 text-slate-600 border border-slate-200/60 hover:bg-white transition cursor-pointer";
                }

                btn.addEventListener('click', () => loadMeals(dateStr));
                quickDateChips.appendChild(btn);
            }
        }

        /**

            state.selectedSchool = null;
            localStorage.removeItem('selected_school');
            schoolSearchInput.value = '';
            headerSchoolName.textContent = 'School Meal';
            headerSchoolSub.textContent = '오늘 우리 학교 급식 미리보기 ✨';
            currentSchoolLabel.textContent = '샘플 데이터 모드 (학교를 검색해 보세요)';
            useSampleModeBtn.classList.add('hidden');
            loadMeals(DEFAULT_DATE);
            refreshUpcomingMealsCache();
        }

        /**
         * 초기화
         */
        function initApp() {
            if (state.apiKey) {
                neisApiKeyInput.value = state.apiKey;
            }

            Object.entries(ALLERGY_MAP).forEach(([code, info]) => {
                const item = document.createElement('div');
                item.className = "flex items-center space-x-1.5 bg-white/50 px-2 py-1 rounded-xl border border-slate-100";
                item.innerHTML = `
                    <span class="text-xs">${info.icon}</span>
                    <span class="truncate"><strong class="text-slate-700">${code}.</strong> ${info.name}</span>
                `;
                allergyLegend.appendChild(item);
            });

            favoriteMenuForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const keyword = favoriteMenuInput.value.trim();
                if (!keyword) return;
                if (favoriteMenus.includes(keyword)) {
                    showMessage(`'${keyword}' 메뉴는 이미 찜 목록에 있어요!`, true);
                    return;
                }
                favoriteMenus.unshift(keyword);
                saveFavoriteMenus();
                favoriteMenuInput.value = '';
                renderFavoriteMenus();
                loadMeals(state.currentDate);
            });

            schoolSearchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const keyword = schoolSearchInput.value.trim();
                if (keyword.length < 2) {
                    showMessage("학교명을 2글자 이상 입력해 주세요!", true);
                    return;
                }
                messageBox.classList.add('hidden');
                searchSchoolFromNeis(keyword);
            });

            toggleApiKeyBtn.addEventListener('click', () => {
                apiKeyBox.classList.toggle('hidden');
            });

            saveApiKeyBtn.addEventListener('click', () => {
                state.apiKey = neisApiKeyInput.value.trim();
                localStorage.setItem('neis_api_key', state.apiKey);
                apiKeyBox.classList.add('hidden');
                showMessage(state.apiKey ? "인증키가 저장되었어요!" : "인증키가 초기화되었어요.");
                if (state.selectedSchool) {
                    loadMeals(state.currentDate);
                }
            });

            useSampleModeBtn.addEventListener('click', resetToSampleMode);

            datePicker.addEventListener('change', (e) => {
                if (e.target.value) loadMeals(e.target.value);
            });

            prevDayBtn.addEventListener('click', () => {
                const prev = addDays(datePicker.value, -1);
                loadMeals(prev);
            });

            nextDayBtn.addEventListener('click', () => {
                const next = addDays(datePicker.value, 1);
                loadMeals(next);
            });

            todayBtn.addEventListener('click', () => {
                const targetDate = state.selectedSchool ? getTodayStr() : DEFAULT_DATE;
                loadMeals(targetDate);
            });

            const savedSchool = localStorage.getItem('selected_school');
            if (savedSchool) {
                try {
                    const parsedSchool = JSON.parse(savedSchool);
                    selectSchool(parsedSchool);
                    return;
                } catch (e) {
                    localStorage.removeItem('selected_school');
                }
            }

            loadMeals(DEFAULT_DATE);
            refreshUpcomingMealsCache();
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
